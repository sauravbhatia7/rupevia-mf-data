name: Update bank deposit rates

on:
  schedule:
    # Daily at 06:45 IST. Bank retail rates change far less often than MF NAVs.
    - cron: '15 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_bank_rates.py'
      - '.github/workflows/update-bank-rates.yml'

permissions:
  contents: write

concurrency:
  group: rupevia-bank-rates
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 pandas lxml

      - name: Build bank-rate snapshot from official sources
        env:
          HTTP_TIMEOUT: '30'
        run: python scripts/update_bank_rates.py

      - name: Validate bank-rate snapshot
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/bank-rates.json','r',encoding='utf-8'))
          assert x['schemaVersion']==1
          assert x['bankCount']==20==len(x['banks'])
          assert x['targetTenuresMonths']==[12,24,36,60]
          assert x['stats']['banksWithAnyVerified']>0
          names={b['name'] for b in x['banks']}
          assert len(names)==20
          for b in x['banks']:
              assert set(b['sources'])=={'fd','rd','savings'}
              for k in ('fdRates','rdRates'):
                  assert isinstance(b[k],dict)
                  for m,v in b[k].items():
                      assert m in {'12','24','36','60'} and 0 < float(v) < 15
              if b['savingsRate'] is not None:
                  assert 0 < float(b['savingsRate']) < 10
          print('bank rate snapshot OK',x['stats'],'as-of',x.get('sourceAsOf'))
          PY

      - name: Upload bank-rate app data
        uses: actions/upload-artifact@v4
        with:
          name: rupevia-bank-rates
          path: data/bank-rates.json
          retention-days: 3

      - name: Commit changed bank data
        run: |
          git config user.name "rupevia-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bank-rates.json
          if git diff --cached --quiet; then
            echo "No bank-rate change"
            exit 0
          fi
          git commit -m "data: refresh bank deposit rates"
          git pull --rebase origin main
          git push
