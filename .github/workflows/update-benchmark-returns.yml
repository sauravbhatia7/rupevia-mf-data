name: Update benchmark TRI returns

on:
  schedule:
    # Weekdays after Indian market close; 18:45 IST.
    - cron: '15 13 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_benchmark_returns.py'
      - '.github/workflows/update-benchmark-returns.yml'

permissions:
  contents: write

concurrency:
  group: rupevia-benchmark-returns
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Build official TRI benchmark snapshot
        env:
          HTTP_TIMEOUT: '45'
          BENCHMARK_WORKERS: '3'
        run: python scripts/update_benchmark_returns.py

      - name: Validate benchmark snapshot
        run: |
          python - <<'PY'
          import datetime as dt, json, math
          from zoneinfo import ZoneInfo
          x=json.load(open('data/benchmark-returns.json','r',encoding='utf-8'))
          ids={'nifty-50':'Nifty 50 TRI','nifty-100':'Nifty 100 TRI','nifty-200':'Nifty 200 TRI','nifty-500':'Nifty 500 TRI','nifty-next-50':'Nifty Next 50 TRI','nifty-midcap-150':'Nifty Midcap 150 TRI','nifty-midcap-select':'Nifty Midcap Select TRI','nifty-smallcap-250':'Nifty Smallcap 250 TRI','nifty-smallcap-100':'Nifty Smallcap 100 TRI'}
          assert x['schemaVersion']==1
          assert x['provider']=='NSE Indices Limited'
          assert x['sourceType']=='official Total Return Index history'
          assert x['quality']['syntheticValues'] is False
          assert x['quality']['totalReturnIndexOnly'] is True
          assert x['quality']['benchmarkCount']==9
          assert x['quality']['failedBenchmarks']==0
          assert x['quality']['dateSanityVersion']==1
          assert x['quality']['antiDowngrade'] is True
          assert len(x['benchmarks'])==9 and x.get('failures')==[]
          src=dt.date.fromisoformat(x['sourceAsOf'])
          generated=dt.datetime.fromisoformat(x['generatedAt'].replace('Z','+00:00')).astimezone(ZoneInfo('Asia/Kolkata')).date()
          today=dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo('Asia/Kolkata')).date()
          assert src<=generated and src<=today
          seen=set()
          for b in x['benchmarks']:
              assert ids.get(b['id'])==b['displayName'] and b['id'] not in seen; seen.add(b['id'])
              assert b['status']=='verified-official'
              assert b['provider']=='NSE Indices Limited'
              assert 'Total Return Index' in b['methodology']
              assert math.isfinite(float(b['latestValue'])) and b['latestValue']>0
              latest=dt.date.fromisoformat(b['latestDate']); assert latest<=src and (src-latest).days<=3
              assert isinstance(b.get('anchors'),dict)
              for p in ('1M','3M','6M','1Y','3Y','5Y','10Y'):
                  assert p in b['returns'] and math.isfinite(float(b['returns'][p])), (b['displayName'],p)
          assert set(seen)==set(ids)
          print('benchmark TRI strict snapshot OK',x['quality'],'as-of',x['sourceAsOf'])
          PY

      - name: Upload benchmark app data
        uses: actions/upload-artifact@v4
        with:
          name: rupevia-benchmark-returns
          path: data/benchmark-returns.json
          retention-days: 3

      - name: Commit changed benchmark data
        run: |
          git config user.name "rupevia-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/benchmark-returns.json
          if git diff --cached --quiet; then
            echo "No benchmark change"
            exit 0
          fi
          git commit -m "data: refresh official benchmark TRI returns"
          git pull --rebase origin main
          git push
