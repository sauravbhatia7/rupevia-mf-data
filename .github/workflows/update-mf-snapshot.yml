name: Update MF snapshot

on:
  schedule:
    # Every 15 minutes during India's evening/overnight NAV publication window.
    # UTC 14:00..23:45 + 00:00..03:45 = IST 19:30..09:15.
    - cron: '0,15,30,45 0-3,14-23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-mf-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: rupevia-mf-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check whether AMFI mirror has a newer NAV date
        id: fresh
        env:
          HTTP_TIMEOUT: '45'
        run: python scripts/check_source_freshness.py

      - name: Build ranked snapshot
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        env:
          TOP_N: '30'
          MAX_WORKERS: '8'
          HTTP_TIMEOUT: '45'
        run: python scripts/update_snapshot_mfapi.py

      - name: Enrich published funds
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        env:
          ENRICH_WORKERS: '8'
          HTTP_TIMEOUT: '45'
        run: python scripts/enrich_snapshot.py

      - name: Build full Direct Growth search universe
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        env:
          HTTP_TIMEOUT: '45'
          ACTIVE_FRESHNESS_DAYS: '7'
        run: python scripts/build_universe.py

      # Logo refresh is useful, but it must never block NAV/data publication.
      - name: Refresh offline AMC logo registry
        id: logos
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        continue-on-error: true
        run: python scripts/build_amc_logos.py

      - name: Rebuild compressed ranked bundle
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        run: |
          python - <<'PY'
          import base64, gzip
          p='data/mf-snapshot.json'
          raw=open(p,'rb').read()
          packed=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode('ascii')+'\n'
          open('data/mf-snapshot.json.gz.b64','w',encoding='ascii').write(packed)
          print('raw',len(raw),'packed',len(packed))
          PY

      - name: Validate MF data
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        run: |
          python - <<'PY'
          import base64, gzip, json
          p='data/mf-snapshot.json'
          raw=open(p,'rb').read(); x=json.loads(raw)
          assert x['schemaVersion']==3
          assert x['stats']['publishedFunds']==240
          assert all(v['count']==30 for v in x['categories'].values())
          assert x.get('quality',{}).get('syntheticResearchFieldsRemoved') is True
          for block in x['categories'].values():
            for f in block['funds']:
              assert 'expense' not in f and 'consistency' not in f and 'researchFieldStatus' not in f
              assert isinstance(f.get('periodRank'),dict)
              assert isinstance(f.get('categoryAverage'),dict)
              assert isinstance(f.get('navSeries'),list) or f.get('navSeries') is None
          packed=open('data/mf-snapshot.json.gz.b64','rt',encoding='ascii').read().strip()
          assert gzip.decompress(base64.b64decode(packed)) == raw
          u=json.load(open('data/mf-universe.json','r',encoding='utf-8'))
          assert u['schemaVersion']==1
          assert u['fundCount']==len(u['funds']) and u['fundCount']>300
          assert u['amcCount']==len(u['amcs']) and u['amcCount']>20
          assert len({str(f['schemeCode']) for f in u['funds']})==u['fundCount']
          up=open('data/mf-universe.json.gz.b64','rt',encoding='ascii').read().strip()
          assert json.loads(gzip.decompress(base64.b64decode(up)))['fundCount']==u['fundCount']
          print('snapshot V3 OK:', x['sourceAsOf'], x['stats'])
          print('full universe OK:', u['sourceAsOf'], u['fundCount'], 'funds /', u['amcCount'], 'AMCs')
          PY

      - name: Audit AMC logo coverage
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('data/amc-logos.json')
          if not p.exists(): raise RuntimeError('AMC logo registry missing')
          u=json.load(open('data/mf-universe.json','r',encoding='utf-8'))
          logos=json.load(open(p,'r',encoding='utf-8'))
          assert logos['schemaVersion']==1
          assert logos['amcCount']==u['amcCount']==logos['logoCount']
          assert set(logos['logos'])==set(u['amcs'])
          assert all(str(v.get('dataUri') or '').startswith('data:image/') for v in logos['logos'].values())
          print('offline AMC logos OK:', logos['logoCount'], '/', logos['amcCount'])
          PY

      - name: Upload app data inputs
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rupevia-mf-app-data
          path: |
            data/mf-snapshot.json
            data/mf-universe.json
            data/amc-logos.json
          retention-days: 2

      - name: Commit changed MF data
        if: ${{ github.event_name == 'workflow_dispatch' || steps.fresh.outputs.refresh == 'true' }}
        run: |
          git config user.name "rupevia-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mf-snapshot.json data/mf-snapshot.json.gz.b64 data/mf-universe.json data/mf-universe.json.gz.b64
          if [ -f data/amc-logos.json ]; then git add data/amc-logos.json; fi
          if git diff --cached --quiet; then
            echo "No MF data change"
            exit 0
          fi
          git commit -m "data: refresh mutual fund snapshot, universe and AMC logos"
          git pull --rebase origin main
          git push
