name: Export current MF bundle

on:
  push:
    paths:
      - '.github/workflows/export-existing-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export deterministic compressed bundle
        run: |
          python - <<'PY'
          import base64, gzip
          raw=open('data/mf-snapshot.json','rb').read()
          packed=base64.b64encode(gzip.compress(raw,compresslevel=9,mtime=0)).decode('ascii')+'\n'
          open('data/mf-snapshot.json.gz.b64','w',encoding='ascii').write(packed)
          print('raw',len(raw),'packed',len(packed))
          PY
      - name: Commit bundle
        run: |
          git config user.name "rupevia-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mf-snapshot.json.gz.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add compressed snapshot bundle"
          git push
