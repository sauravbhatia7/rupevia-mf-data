name: Export current MF bundle

on:
  push:
    paths:
      - '.github/workflows/export-existing-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload current snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupevia-mf-snapshot
          path: data/mf-snapshot.json
          if-no-files-found: error
          retention-days: 1
